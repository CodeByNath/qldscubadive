name: Test and deploy

# Every push and pull request runs the full test suite. A push to the
# `staging` branch (or a manual run) additionally builds the Admin Station and
# copies the plugin and theme to the SiteGround staging site over SSH.
#
# The server never runs npm or Composer: it receives built files only.
#
# Settings → Secrets and variables → Actions. The key and passphrase must be
# repository Secrets; host, port, user and path may be Secrets or Variables:
#   STAGING_SSH_HOST        e.g. c1117292.sgvps.net
#   STAGING_SSH_PORT        e.g. 18765
#   STAGING_SSH_USER        the SiteGround SSH user
#   STAGING_SSH_KEY         private key from SiteGround's SSH Keys Manager
#   STAGING_SSH_PASSPHRASE  that key's password (leave unset if none)
#   STAGING_WP_PATH         absolute WordPress root, e.g. /home/customer/www/<site>/public_html

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wp-content/plugins/qsd-platform

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wp-content/plugins/qsd-platform/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: npm ci
      - run: npm test

      - name: Upload built Admin Station
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: wp-content/plugins/qsd-platform/dist
          retention-days: 7

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download built Admin Station
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: wp-content/plugins/qsd-platform/dist

      # Prepares the key and reports precisely what is wrong, as annotations,
      # without ever printing a secret value.
      - name: Load SSH key
        working-directory: .
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          WP_PATH: ${{ secrets.STAGING_WP_PATH || vars.STAGING_WP_PATH }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          missing=""
          for name in SSH_HOST SSH_PORT SSH_USER WP_PATH; do
            [ -n "${!name}" ] || missing="$missing STAGING_$name"
          done
          [ -n "$SSH_KEY" ] || missing="$missing STAGING_SSH_KEY(must be a Secret)"
          [ -z "$missing" ] || fail "Missing or empty:$missing. Host, port, user and path may be Repository secrets or Repository variables; the key and passphrase must be Repository secrets (Settings → Secrets and variables → Actions)."
          case "$SSH_PORT" in (*[!0-9]*) fail "STAGING_SSH_PORT must be a number only (e.g. 18765).";; esac
          case "$SSH_HOST" in (*@*|*/*|*:*|*" "*) fail "STAGING_SSH_HOST must be the host name only (e.g. c1117292.sgvps.net), without user, port or ssh://.";; esac
          case "$SSH_USER" in (*@*|*" "*) fail "STAGING_SSH_USER must be the user name only, without @host.";; esac

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -n1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----' \
            || fail "STAGING_SSH_KEY does not start with a '-----BEGIN … PRIVATE KEY-----' line. Paste the whole PRIVATE key (not the public key), including the BEGIN and END lines."
          tail -n1 ~/.ssh/deploy_key | grep -q -- '-----END .*PRIVATE KEY-----' \
            || fail "STAGING_SSH_KEY does not end with its '-----END … PRIVATE KEY-----' line. Paste the whole key."

          if ! ssh-keygen -y -P "$SSH_PASSPHRASE" -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            if [ -z "$SSH_PASSPHRASE" ]; then
              fail "STAGING_SSH_KEY is protected by a password, but STAGING_SSH_PASSPHRASE is empty or missing."
            else
              fail "STAGING_SSH_KEY could not be opened with STAGING_SSH_PASSPHRASE: the password is wrong, or the key text was damaged when pasted."
            fi
          fi
          # Remove the password from this runner-local copy so ssh never prompts.
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key > /dev/null 2>&1 \
              || fail "Could not unlock STAGING_SSH_KEY for use."
          fi

          timeout 20 ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] \
            || fail "No SSH server answered at STAGING_SSH_HOST on port STAGING_SSH_PORT. Check both values."

          echo "SSH_CMD=ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
          echo "SSH key loaded; server reachable."

      - name: Check SSH login
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
        run: |
          $SSH_CMD "$SSH_USER@$SSH_HOST" true \
            || { echo "::error::SSH login refused. Check STAGING_SSH_USER, and that this key is authorised in SiteGround's SSH Keys Manager."; exit 1; }
          echo "SSH login works."

      # Safety guard: the SSH account can reach every site on the hosting
      # plan (including the live site), so refuse to deploy unless the target
      # is exactly the staging WordPress root and looks like a WordPress install.
      - name: Verify the target is the staging site
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          WP_PATH: ${{ secrets.STAGING_WP_PATH || vars.STAGING_WP_PATH }}
          EXPECTED_WP_PATH: /home/customer/www/staging2.qldscubadive.com.au/public_html
        run: |
          set -euo pipefail
          if [ "$WP_PATH" != "$EXPECTED_WP_PATH" ]; then
            echo "::error::STAGING_WP_PATH is not the staging site root ($EXPECTED_WP_PATH). Refusing to deploy."
            exit 1
          fi
          $SSH_CMD "$SSH_USER@$SSH_HOST" \
            "test -f '$WP_PATH/wp-config.php' && test -d '$WP_PATH/wp-content/plugins' && test -d '$WP_PATH/wp-content/themes'" \
            || { echo "::error::$WP_PATH is not a WordPress root on the server. Refusing to deploy."; exit 1; }
          echo "Target verified: $WP_PATH"

      - name: Copy plugin and theme
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          WP_PATH: ${{ secrets.STAGING_WP_PATH || vars.STAGING_WP_PATH }}
        run: |
          set -euo pipefail
          test -f wp-content/plugins/qsd-platform/dist/js/admin-station.js
          # --delete applies only inside the two destination folders below
          # (wp-content/plugins/qsd-platform/ and wp-content/themes/qsd-shell/);
          # nothing else on the server is written or removed.
          # Runtime files only: PHP, templates, Atomic Engine CSS, built dist.
          rsync -az --delete -e "$SSH_CMD" \
            --include='/qsd-platform.php' --include='/src/***' --include='/app/***' \
            --include='/atomic-engine/***' --include='/dist/***' --exclude='*' \
            wp-content/plugins/qsd-platform/ "$SSH_USER@$SSH_HOST:$WP_PATH/wp-content/plugins/qsd-platform/"
          rsync -az --delete -e "$SSH_CMD" \
            wp-content/themes/qsd-shell/ "$SSH_USER@$SSH_HOST:$WP_PATH/wp-content/themes/qsd-shell/"

      - name: Smoke check
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          WP_PATH: ${{ secrets.STAGING_WP_PATH || vars.STAGING_WP_PATH }}
        run: |
          $SSH_CMD "$SSH_USER@$SSH_HOST" "ls -1 '$WP_PATH/wp-content/plugins/qsd-platform' '$WP_PATH/wp-content/plugins/qsd-platform/dist/js' '$WP_PATH/wp-content/themes/qsd-shell'"
